  :root {
    --serif: "Yonder Murmur", "Cormorant Garamond", Garamond, Georgia, serif;   /* fallbacks only if the embedded font fails */
    --ink: #eef3ff;
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #02040b;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  canvas { display: block; position: fixed; inset: 0; }

  .overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--ink); font-family: var(--serif); font-weight: 400; text-align: center;
    transition: opacity 1.8s ease; padding: 24px; box-sizing: border-box;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }

  /* ---------- Opening screen: the album cover in a frame ---------- */
  #title { position: fixed; inset: 0; z-index: 10; --S: min(74vh, 88vw); --zoom: 3;
    color: var(--ink); font-family: var(--serif); font-weight: 400; text-align: center; }
  #title.gone { display: none; }
  /* The frame is a square window; its huge shadow blacks out everything around it.
     With no cover image the live forest shows through, framed like a cover. */
  #frame { position: absolute; left: 50%; top: 50%; width: var(--S); height: var(--S);
    margin: calc(var(--S) / -2) 0 0 calc(var(--S) / -2); overflow: hidden; cursor: pointer;
    box-shadow: 0 0 0 200vmax #03050d; outline: 1px solid rgba(238,243,255,.22);
    transition: outline-color 1s ease; will-change: transform; }
  #frame:hover { outline-color: rgba(238,243,255,.6); }
  #cover { width: 100%; height: 100%; object-fit: cover; display: none; will-change: transform, opacity; }
  #frame.has-cover #cover { display: block; }
  /* Click: the cover zooms and dissolves into the 3D forest while the frame opens out */
  #title.opening #frame { outline-color: transparent; cursor: default; }
  #logoSlot, #beginWrap { position: absolute; left: 0; right: 0; height: calc(50% - var(--S) / 2); z-index: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity .9s ease; pointer-events: none; }
  #logoSlot { top: 0; display: none; }   /* the cover artwork already carries the logo; remove display:none to show it above */
  #beginWrap { bottom: 0; }
  #title.opening #logoSlot, #title.opening #beginWrap { opacity: 0; }
  #logo { max-width: min(70vw, 420px); max-height: calc((100vh - var(--S)) / 2 * .84); display: none;
    filter: drop-shadow(0 0 14px rgba(190,210,255,.5)); }
  #logoPlaceholder { border: 1px dashed rgba(238,243,255,.45); padding: 14px 34px; letter-spacing: 0;
    font-size: 13px; text-transform: none; color: rgba(238,243,255,.7); }
  #logoSlot.has-logo #logo { display: block; }
  #logoSlot.has-logo #logoPlaceholder { display: none; }
  #begin { font-size: clamp(24px, 3vw, 38px); letter-spacing: 0; text-transform: none;
    text-shadow: 0 0 18px rgba(170,200,255,.8); animation: breathe 3.2s ease-in-out infinite; }
  #begin small { display: block; margin-top: 6px; font-size: 20px; letter-spacing: 0;
    text-transform: none; font-style: normal; opacity: .7; }
  #loading { font-style: normal; letter-spacing: 0; opacity: .7; }
  @keyframes breathe { 0%,100% { opacity: .55; } 50% { opacity: 1; } }

  /* ---------- HUD ---------- */
  #hud { position: fixed; top: 20px; left: 24px; z-index: 5; color: var(--ink);
    font-family: var(--serif); font-weight: 400; font-size: 34px; letter-spacing: 0;
    display: flex; align-items: center; gap: 10px; pointer-events: none;
    text-shadow: 0 0 12px rgba(170,200,255,.9); opacity: 0; transition: opacity 1.5s ease; }
  #hud.show { opacity: .95; }
  #hud svg { width: 20px; height: 20px; filter: drop-shadow(0 0 6px rgba(190,215,255,.95)); }
  #hud.pulse svg { animation: pop .6s ease; }
  @keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.7) rotate(20deg); } 100% { transform: scale(1); } }

  /* ---------- Album player ---------- */
  #player { position: fixed; top: 14px; right: 20px; z-index: 12; display: flex; align-items: center; gap: 4px;
    color: var(--ink); font-family: var(--serif); border: 1px solid rgba(238,243,255,.3); border-radius: 999px;
    padding: 3px 8px 3px 16px; background: rgba(3,5,13,.35); }
  #trackTitle { font-size: 22px; margin-right: 8px; max-width: 46vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 0 10px rgba(170,200,255,.8); }
  #player button { background: none; border: 0; padding: 7px; cursor: pointer; display: flex; opacity: .8; }
  #player button:hover { opacity: 1; }
  #player svg { width: 18px; height: 18px; fill: var(--ink); filter: drop-shadow(0 0 5px rgba(190,215,255,.9)); }
  #playBtn .ic-pause { display: none; } #playBtn.on .ic-pause { display: block; } #playBtn.on .ic-play { display: none; }
  #muteBtn { position: fixed; top: 64px; right: 22px; z-index: 12; background: none;
    border: 1px solid rgba(238,243,255,.3); border-radius: 999px; color: var(--ink);
    font-family: var(--serif); font-size: 22px; font-style: normal; letter-spacing: 0;
    padding: 2px 18px; cursor: pointer; opacity: .75; }
  #muteBtn:hover { opacity: 1; border-color: rgba(238,243,255,.7); }

  #hint { position: fixed; left: 0; right: 0; bottom: 26px; z-index: 5; text-align: center;
    color: var(--ink); font-family: var(--serif); font-style: normal; font-size: 28px;
    letter-spacing: 0; opacity: 0; transition: opacity 2s ease; pointer-events: none;
    text-shadow: 0 0 10px rgba(2,4,12,.9); }
  #hint.show { opacity: .8; }

  /* ---------- Win screen ---------- */
  #win { background: radial-gradient(ellipse at center, rgba(2,4,12,0) 0%, rgba(2,4,12,.45) 100%); }
  #win h1 { font-weight: 400; font-size: clamp(40px, 6.5vw, 84px); letter-spacing: 0; margin: 0 0 12px;
    text-shadow: 0 0 26px rgba(190,215,255,.9); }
  #win p { font-style: normal; font-size: 30px; opacity: .8; margin: 0 0 34px; letter-spacing: 0; }
  #againBtn { background: none; color: var(--ink); font-family: var(--serif); font-size: 28px;
    letter-spacing: 0; text-transform: none; padding: 6px 34px; cursor: pointer;
    border: 1px solid rgba(238,243,255,.55); border-radius: 999px; transition: all .4s ease; }
  #againBtn:hover { background: rgba(238,243,255,.12); box-shadow: 0 0 26px rgba(170,200,255,.5); }

  /* ---------- Mobile controls ---------- */
  #joy { position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
    border: 1px solid rgba(238,243,255,.35); background: rgba(238,243,255,.05); z-index: 6;
    display: none; pointer-events: none; }
  #joyKnob { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px;
    border-radius: 50%; background: rgba(238,243,255,.35); box-shadow: 0 0 16px rgba(190,215,255,.6); }
  #jumpBtn { position: fixed; right: 26px; bottom: 34px; width: 70px; height: 70px; border-radius: 50%;
    z-index: 6; border: 1px solid rgba(238,243,255,.4); background: rgba(238,243,255,.06);
    color: var(--ink); font-family: var(--serif); font-style: normal; font-size: 22px; display: none; }
  body.mobile.playing #jumpBtn { display: block; }
</style>

/* Small deterministic random helpers so the forest is the same every visit */
function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

/* =====================================================================
   3. TREE GENERATOR
   Recursive tapered tubes written straight into one merged BufferGeometry.
   ===================================================================== */
const _up = new V3(0, 1, 0), _xAxis = new V3(1, 0, 0);

/** Collects many tapered tubes into a single geometry (position + vertex colour). */
class TubeBuilder {
  constructor() { this.pos = []; this.col = []; this.idx = []; this.v = 0; this.tint = [1, 1, 1]; }
  /**
   * @param {V3[]} points   centre line of the tube
   * @param {number[]} radii radius at each point
   * @param {number} radial  sides around the tube
   * @param {number[]} bright per-point brightness (thick wood glows more than fine twigs)
   */
  add(points, radii, radial, bright) {
    const n = points.length, base = this.v;
    const T = new V3(), B = new V3(); let N = null;
    for (let i = 0; i < n; i++) {
      if (i === 0) T.subVectors(points[1], points[0]);
      else if (i === n - 1) T.subVectors(points[i], points[i - 1]);
      else T.subVectors(points[i + 1], points[i - 1]);
      T.normalize();
      // parallel-transport the frame so the tube never twists
      if (!N) N = new V3().crossVectors(T, Math.abs(T.y) < 0.9 ? _up : _xAxis).normalize();
      else N.addScaledVector(T, -N.dot(T)).normalize();
      B.crossVectors(T, N);
      const r = radii[i], b = bright[i], p = points[i];
      for (let j = 0; j < radial; j++) {
        const a = j / radial * Math.PI * 2, c = Math.cos(a) * r, s = Math.sin(a) * r;
        this.pos.push(p.x + N.x * c + B.x * s, p.y + N.y * c + B.y * s, p.z + N.z * c + B.z * s);
        this.col.push(b * this.tint[0], b * this.tint[1], b * this.tint[2]);
      }
    }
    for (let i = 0; i < n - 1; i++) for (let j = 0; j < radial; j++) {
      const a = base + i * radial + j, b = base + i * radial + (j + 1) % radial;
      const c = a + radial, d = b + radial;
      this.idx.push(a, c, b, b, c, d);
    }
    this.v += n * radial;
  }
  /** One flat triangle with a colour per corner (leaves, petals, blades). */
  tri(a, b, c, ca, cb, cc) {
    this.pos.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z);
    this.col.push(...ca, ...cb, ...cc);
    this.idx.push(this.v, this.v + 1, this.v + 2); this.v += 3;
  }
  build() {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.pos, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(this.col, 3));
    g.setIndex(this.idx);
    return g;
  }
}

function perpTo(dir, angle) {
  const p = new V3().crossVectors(dir, Math.abs(dir.y) < 0.95 ? _up : _xAxis).normalize();
  return p.applyAxisAngle(dir, angle);
}

/**
 * Generates one bare tree, normalised so its total height is 1 unit.
 * Each branch owns a seed derived from its parent, so a lower `maxDepth`
 * produces exactly the same tree with the finest twigs pruned (clean LOD).
 */
function generateTree(seed, maxDepth, o = {}) {
  const R = rng(seed), tb = new TubeBuilder();
  const trunkH = 0.36 + R() * 0.05;
  const trunkR = o.trunkR ?? 0.028;
  const minR = 0.0013;
  const outward = o.outward ?? 0.08;                      // how strongly the crown spreads sideways
  // brightness: full white for trunk and core, fainter for wiry twigs
  const bright = r => 0.6 + 0.4 * Math.min(1, Math.pow(r / 0.018, 0.75));

  // ---- Trunk: straight, fairly thick, flaring where it meets the ground
  const pts = [], rads = [], brs = [], TS = 10;
  let wx = 0, wz = 0;
  for (let i = 0; i <= TS; i++) {
    const t = Math.pow(i / TS, 1.6);                      // more rings near the base for the flare
    if (i > 1) { wx += (R() - 0.5) * 0.008; wz += (R() - 0.5) * 0.008; }
    pts.push(new V3(wx, -0.03 + (trunkH + 0.03) * t, wz));
    rads.push(trunkR * (1 - 0.26 * t) * (1 + 1.5 * Math.pow(1 - t, 9)));
    brs.push(1);
  }
  tb.add(pts, rads, 10, brs);
  // a few root toes spreading from the base
  const nRoots = 4 + Math.floor(R() * 3), ra0 = R() * 6.283;
  for (let k = 0; k < nRoots; k++) {
    const a = ra0 + k / nRoots * 6.283 + (R() - 0.5) * 0.6, len = 0.05 + R() * 0.04;
    const c = Math.cos(a), s = Math.sin(a);
    tb.add([new V3(c * trunkR * 0.7, 0.035, s * trunkR * 0.7), new V3(c * (trunkR + len * 0.5), 0.008, s * (trunkR + len * 0.5)),
            new V3(c * (trunkR + len), -0.02, s * (trunkR + len))], [trunkR * 0.5, trunkR * 0.3, trunkR * 0.08], 6, [1, 1, 0.9]);
  }

  // ---- Recursive branches
  function branch(bseed, start, dir, len, r0, level) {
    const R = rng(bseed);
    const segs = level <= 1 ? 7 : level <= 3 ? 5 : level <= 5 ? 3 : 2;
    const radial = r0 > 0.016 ? 8 : r0 > 0.008 ? 6 : r0 > 0.0035 ? 4 : 3;
    const r1 = Math.max(r0 * 0.62, minR);
    const bp = [start.clone()], br = [r0], bb = [bright(r0)];
    const p = start.clone(), d = dir.clone();
    const wobble = 0.16 + level * 0.035;                  // finer branches are more crooked
    for (let i = 1; i <= segs; i++) {
      d.addScaledVector(perpTo(d, R() * 6.283), R() * wobble);
      // gentle pull outward from the trunk axis -> wide dome-shaped crown
      const ol = Math.hypot(p.x, p.z);
      if (ol > 1e-4) { d.x += p.x / ol * outward; d.z += p.z / ol * outward; }
      if (d.y < 0.05) d.y += 0.14;                        // twigs never droop far
      d.normalize();
      p.addScaledVector(d, len / segs);
      const r = lerp(r0, r1, i / segs);
      bp.push(p.clone()); br.push(r); bb.push(bright(r));
    }
    tb.add(bp, br, radial, bb);
    if (level >= maxDepth) return;

    const kids = level < 2 ? 2 + (R() < 0.65 ? 1 : 0) : 2 + (R() < 0.55 ? 1 : 0);
    const phi0 = R() * 6.283;
    for (let k = 0; k < kids; k++) {
      let sp = p, sr = r1, sd = d;
      if (k === 2) {                                      // third child sprouts part-way along
        const idx = Math.max(1, Math.min(segs - 1, Math.floor(segs * (0.45 + R() * 0.35))));
        sp = bp[idx]; sr = br[idx] * 0.8; sd = new V3().subVectors(bp[idx + 1], bp[idx]).normalize();
      }
      const spread = 0.34 + R() * 0.36;
      const axis = perpTo(sd, phi0 + k / kids * 6.283 + (R() - 0.5) * 0.7);
      const cd = sd.clone().applyAxisAngle(axis, spread);
      const cl = len * (0.7 + R() * 0.13);
      const cr = Math.max(sr * (k === 0 ? 0.88 : 0.74), minR);
      branch(hashSeed(bseed, k), sp, cd, cl, cr, level + 1);
    }
  }

  // ---- 3–5 main limbs angled up and out from the top of the trunk
  const top = pts[TS], topR = rads[TS];
  const lo = o.limbsMin ?? 3, hi = o.limbsMax ?? 5;
  const nL = lo + Math.floor(R() * (hi - lo + 1)), az0 = R() * 6.283;
  for (let k = 0; k < nL; k++) {
    const az = az0 + k / nL * 6.283 + (R() - 0.5) * 0.5, tilt = (o.tilt ?? 0.62) + R() * (o.tiltRange ?? 0.42);
    const d = new V3(Math.sin(tilt) * Math.cos(az), Math.cos(tilt), Math.sin(tilt) * Math.sin(az));
    branch(hashSeed(seed, 100 + k), top, d, 0.2 + R() * 0.06, topR * 0.78, 1);
  }

  const geo = tb.build();
  geo.computeBoundingBox();
  const s = 1 / geo.boundingBox.max.y;                    // normalise: height = 1
  geo.scale(s, s, s);
  geo.computeBoundingSphere(); geo.computeBoundingBox();
  geo.userData.trunkR = trunkR * s;
  geo.userData.forkY = trunkH * s;                        // height where the limbs part (owls perch here)
  return geo;
}

function instanced(geo, mat, list) {
  const mesh = new THREE.InstancedMesh(geo, mat, list.length);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), s = new V3();
  list.forEach((it, i) => {
    e.set(it.rx || 0, it.r, it.rz || 0); q.setFromEuler(e);
    s.set(it.s * (it.sx || 1), it.s * (it.sy || 1), it.s * (it.sz || 1));
    m.compose(new V3(it.x, it.y || 0, it.z), q, s); mesh.setMatrixAt(i, m);
  });
  mesh.computeBoundingSphere();
  scene.add(mesh);
  return mesh;
}

}

function updatePlayer(dt, t, canMove) {
  const p = player.root.position;

  let mx = 0, mz = 0;
  if (canMove) {
    const k = input.keys;
    if (k.has('KeyW') || k.has('ArrowUp')) mz += 1;
    if (k.has('KeyS') || k.has('ArrowDown')) mz -= 1;
    if (k.has('KeyD') || k.has('ArrowRight')) mx += 1;
    if (k.has('KeyA') || k.has('ArrowLeft')) mx -= 1;

  let mag = Math.hypot(mx, mz);
  if (mag > 1) { mx /= mag; mz /= mag; mag = 1; }

  const speed = slow ? SLOW_SPEED : WALK_SPEED;

  const rx = Math.cos(cam.yaw), rz = -Math.sin(cam.yaw);           // camera right

    p.y += player.vy * dt;

function updateCamera(dt, t) {

    // The cover shot. The camera is level and placed so the 3D hero tree sits exactly where the
    // tree is printed on the cover: same base, same height. Dissolving the artwork then turns
    // the flat tree into the real one in place, and flying forward matches the artwork's zoom.
    if (state !== 'intro') {
      const k = frameEl.offsetHeight / innerHeight, T = Math.tan(camera.fov * Math.PI / 360);
      intro.d0 = CFG.heroScale / ((COVER.treeBase - COVER.treeTop) * 2 * k * T);
      intro.h0 = (COVER.treeBase - 0.5) * 2 * k * intro.d0 * T;
    }
    let d = intro.d0, h = intro.h0, lookY = intro.h0;
    if (state === 'intro') {
      intro.t += dt;
      const u = Math.min(1, intro.t / intro.dur), e = u * u * (3 - 2 * u);
      d = intro.d0 * (1 - 0.56 * e);                         // fly straight in
      const s = intro.d0 / d, F = 1 + (intro.zoom - 1) * e * e;   // artwork scale matches the flight; the frame opens out
      frameEl.style.transform = `scale(${F})`;
      coverEl.style.transform = `scale(${s / F})`;
      coverEl.style.opacity = clamp(1 - u / 0.5, 0, 1);      // the printed tree dissolves into the 3D one
      const v = clamp((u - 0.5) / 0.5, 0, 1), ve = v * v * (3 - 2 * v);
      h = lerp(intro.h0, 8, ve); lookY = lerp(intro.h0, 13, ve);
      if (u >= 1) { state = 'play'; titleEl.classList.add('gone'); hudEl.classList.add('show'); hintEl.classList.add('show'); setTimeout(() => hintEl.classList.remove('show'), 9000); }
    }
    camera.position.set(Math.sin(CFG.coverAz) * d, h, Math.cos(CFG.coverAz) * d);
    cam.look.set(0, lookY, 0);
  } else {
    cam.dist = lerp(cam.dist, cam.targetDist, damp(dt, 6));
    const p = player.root.position, cp = Math.cos(cam.pitch);
    _lookWant.set(p.x, p.y + 1.5 + cam.dist * 0.06, p.z);
    _camWant.set(_lookWant.x + Math.sin(cam.yaw) * cp * cam.dist,
                 Math.max(0.35, _lookWant.y + Math.sin(cam.pitch) * cam.dist),
                 _lookWant.z + Math.cos(cam.yaw) * cp * cam.dist);
    const k = damp(dt, introEase);                         // slow glide in from the title shot
    introEase = Math.min(7, introEase + dt * 1.6);
    camera.position.lerp(_camWant, k); cam.look.lerp(_lookWant, Math.min(1, k * 1.5));
  }
  camera.lookAt(cam.look);
  if (state === 'title') {                                 // hang the moon where it is printed on the cover
    camera.updateMatrixWorld();
    const k = frameEl.offsetHeight;
    _moonDir.set((COVER.moonX - 0.5) * 2 * k / innerWidth, (0.5 - COVER.moonY) * 2 * k / innerHeight, 0.5).unproject(camera).sub(camera.position).normalize();
    for (const m of moonSprites) m.position.copy(_moonDir).multiplyScalar(800);
  }
  skyGroup.position.copy(camera.position);
}
let introEase = 0.8;
// Where the tree and moon sit on the cover artwork, as fractions of its width/height.
const COVER = { treeBase: 0.756, treeTop: 0.25, moonX: 0.262, moonY: 0.295 };

// --- Shared point-sprite shader for bursts and motes (soft additive dots)
const pointUniforms = { uPR: { value: CFG.pixelRatio }, uScale: { value: innerHeight * 0.9 } };
function makePointMaterial(color = new V3(0.82, 0.9, 1.0)) {
  return new THREE.ShaderMaterial({
    uniforms: { uPR: pointUniforms.uPR, uScale: pointUniforms.uScale, uColor: { value: color } },
    vertexShader: /* glsl */`
      attribute float aSize, aAlpha;
      uniform float uPR, uScale;
      varying float vA;
      void main() {
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mv;
        float d = -mv.z;
        gl_PointSize = clamp(aSize * uScale * uPR / max(d, 0.1), 1.0, 64.0 * uPR);
        vA = aAlpha * smoothstep(95.0, 30.0, d);
      }`,
    fragmentShader: /* glsl */`
      uniform vec3 uColor; varying float vA;
      void main() {
        float d = length(gl_PointCoord - 0.5);
        float a = smoothstep(0.5, 0.0, d); a *= a;
        gl_FragColor = vec4(uColor * a * vA, 1.0);
      }`,
    blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, fog: false,
  });
}

function spawnBurst(at, count = 40, spread = 1) {
  for (let n = 0; n < count; n++) {
    const i = burst.next; burst.next = (burst.next + 1) % BURST_MAX;
    const a = Math.random() * 6.283, r = Math.random() * 0.3 * spread;
    burst.pos[i * 3] = at.x + Math.cos(a) * r; burst.pos[i * 3 + 1] = at.y + (Math.random() - 0.3) * 0.4; burst.pos[i * 3 + 2] = at.z + Math.sin(a) * r;
    const sp = (0.5 + Math.random() * 1.8) * spread;
    burst.vel[i * 3] = Math.cos(a) * sp; burst.vel[i * 3 + 1] = 1.0 + Math.random() * 2.6; burst.vel[i * 3 + 2] = Math.sin(a) * sp;
    burst.max[i] = burst.life[i] = 2.6 + Math.random() * 2.6;
    burst.size[i] = 0.05 + Math.random() * 0.1;
  }
}
function updateBurst(dt) {
  const drag = Math.exp(-1.4 * dt);
  for (let i = 0; i < BURST_MAX; i++) {
    if (burst.life[i] <= 0) { burst.alpha[i] = 0; continue; }
    burst.life[i] -= dt;
    burst.vel[i * 3] *= drag; burst.vel[i * 3 + 2] *= drag;
    burst.vel[i * 3 + 1] += 0.9 * dt;                       // keeps rising into the sky
    burst.pos[i * 3] += burst.vel[i * 3] * dt; burst.pos[i * 3 + 1] += burst.vel[i * 3 + 1] * dt; burst.pos[i * 3 + 2] += burst.vel[i * 3 + 2] * dt;
    const k = Math.max(0, burst.life[i] / burst.max[i]);
    burst.alpha[i] = Math.min(1, k * 1.6) * (0.75 + 0.25 * Math.sin(burst.life[i] * 14 + i));
  }
  burstGeo.attributes.position.needsUpdate = true;
  burstGeo.attributes.aAlpha.needsUpdate = true;
}

// --- Stardust pieces
const dusts = [];

const dustSpots = [];                                       // the 40 starting positions (reused by "Wander again")
{
  const R = rng(31337);
  const ok = (x, z) => Math.abs(x) < 186 && Math.abs(z) < 186 && clearOfTrunks(x, z, 1.4)
    && Math.hypot(x - CFG.spawn.x, z - CFG.spawn.z) > 7 && !dustSpots.some(d => Math.hypot(d.x - x, d.z - z) < 4);
  const tryAdd = (fn, n) => { let tries = 0; while (n > 0 && tries++ < 4000) { const [x, z] = fn(); if (ok(x, z)) { dustSpots.push({ x, z }); n--; } } };
  // a few close to the start so the first steps are rewarded
  tryAdd(() => { const a = R() * 6.283, d = 9 + R() * 18; return [Math.cos(a) * d, Math.sin(a) * d]; }, 4);
  // nestled among tree roots
  tryAdd(() => { const t = trees[Math.floor(R() * trees.length)], a = R() * 6.283, d = 2.2 + R() * 2.6; return [t.x + Math.cos(a) * d, t.z + Math.sin(a) * d]; }, 15);
  // hidden in the far clearings
  for (const c of clearings.slice(1)) tryAdd(() => { const a = R() * 6.283, d = R() * c.r * 0.7; return [c.x + Math.cos(a) * d, c.z + Math.sin(a) * d]; }, 2);
  // the rest scattered anywhere
  tryAdd(() => [(R() * 2 - 1) * 185, (R() * 2 - 1) * 185], CFG.dustTotal - dustSpots.length);
}

    polygonOffset: true, polygonOffsetFactor: -3, polygonOffsetUnits: -3 }));

const _dustPos = new V3();
function updateDust(dt, t) {
  const p = player.root.position;
  for (let i = dusts.length - 1; i >= 0; i--) {
    const d = dusts[i];
    d.born = Math.min(1, d.born + dt * 0.8);
    const pulse = 0.5 + 0.5 * Math.sin(t * 2.2 + d.phase);
    const bob = Math.sin(t * 1.1 + d.phase) * 0.14;
    d.group.position.y = 0.95 + bob; d.pool.position.y = -0.9 - bob;
    const dist = Math.hypot(d.x - camera.position.x, d.z - camera.position.z);
    const vis = clamp(1.3 - dist / 130, 0.1, 1) * d.born;   // distant pieces glimmer faintly through the haze
    d.spark.scale.setScalar(0.85 + pulse * 0.45);
    d.spark.material.rotation = t * 0.3 + d.phase;
    d.spark.material.opacity = vis;
    d.glow.scale.setScalar(1.3 + pulse * 0.35);
    d.glow.material.opacity = 0.5 * vis;
    d.pool.material.opacity = (0.28 + pulse * 0.2) * vis;

function launchShootingStar() {
  // pick somewhere distant but reachable for the new piece to land
  const p = player.root.position;
  for (let tries = 0; tries < 40; tries++) {
    const a = Math.random() * 6.283, d = 55 + Math.random() * 75;
    const x = p.x + Math.cos(a) * d, z = p.z + Math.sin(a) * d;
    if (Math.abs(x) > 185 || Math.abs(z) > 185 || !clearOfTrunks(x, z, 1.5)) continue;
    shoot.target.set(x, 0, z);
    const az = Math.atan2(x - camera.position.x, z - camera.position.z), off = (Math.random() < 0.5 ? -1 : 1) * (0.5 + Math.random() * 0.4);
    const dir = (azm, el) => new V3(Math.sin(azm) * Math.cos(el), Math.sin(el), Math.cos(azm) * Math.cos(el));
    shoot.from.copy(dir(az + off, 0.62)).multiplyScalar(600);
    shoot.to.copy(dir(az, 0.07)).multiplyScalar(600);
    shoot.active = true; shoot.t = 0; shootLine.visible = shootHead.visible = true;
    return;
  }
}
const _h = new V3(), _tl = new V3();
function updateShooting(dt) {
  if (state === 'play') {
    shoot.timer -= dt;
    if (shoot.timer <= 0 && !shoot.active) { shoot.timer = 38 + Math.random() * 40; launchShootingStar(); }
  }
  if (shoot.active) {
    shoot.t += dt / shoot.dur;
    const k = Math.min(1, shoot.t), e = k * k * (3 - 2 * k);
    _h.lerpVectors(shoot.from, shoot.to, e).add(camera.position);
    _tl.lerpVectors(shoot.from, shoot.to, Math.max(0, e - 0.22)).add(camera.position);
    const a = shootGeo.attributes.position.array;
    a[0] = _h.x; a[1] = _h.y; a[2] = _h.z; a[3] = _tl.x; a[4] = _tl.y; a[5] = _tl.z;
    shootGeo.attributes.position.needsUpdate = true;
    shootHead.position.copy(_h);
    shootHead.material.opacity = Math.sin(k * Math.PI) * 0.9 + 0.1;
    if (shoot.t >= 1) {
      shoot.active = false; shootLine.visible = shootHead.visible = false;
      spawnDust(shoot.target.x, shoot.target.z);
      spawnBeam(shoot.target.x, shoot.target.z);
      spawnBurst(new V3(shoot.target.x, 1, shoot.target.z), 60, 2.2);
      playChime(0.5, 0.35);
    }
  }
  for (let i = beams.length - 1; i >= 0; i--) {
    const b = beams[i]; b.t += dt;
    const k = b.t / b.life;
    b.mesh.material.uniforms.uA.value = Math.min(1, b.t * 2) * Math.pow(1 - k, 1.5) * (0.5 + 0.08 * Math.sin(b.t * 5));
    if (k >= 1) { scene.remove(b.mesh); b.mesh.material.dispose(); beams.splice(i, 1); }
  }
}

  motes.spd[i] = 0.15 + Math.random() * 0.5; motes.ph[i] = Math.random() * 6.283; motes.size[i] = 0.035 + Math.random() * 0.075;

function updateMotes(dt, t) {
  const cx = camera.position.x, cz = camera.position.z;

      void main() {
        float a = uTime * aR.y + aC.w, r = aR.x * (0.7 + 0.3 * sin(uTime * 0.31 + aC.w * 3.0));
        vec3 c = aC.xyz + vec3(cos(a) * r, sin(uTime * 0.8 + aC.w * 2.0) * 0.6 + sin(uTime * 5.0 + aC.w) * 0.08, sin(a) * r);
        vec2 fw = vec2(-sin(a), cos(a)) * sign(aR.y);       // heading along the orbit
        float flap = sin(uTime * 22.0 + aC.w * 7.0) + 0.2;
        float sx = position.x * cos(flap), sy = abs(position.x) * sin(flap);
        vec3 wp = c + vec3(fw.y * sx + fw.x * position.z, sy, -fw.x * sx + fw.y * position.z) * 1.3;
        vec4 mv = viewMatrix * vec4(wp, 1.0);
        gl_Position = projectionMatrix * mv;
        float d = length(mv.xyz); vFog = 1.0 - exp(-uFogDensity * uFogDensity * d * d);
      }`,
    fragmentShader: /* glsl */`
      uniform vec3 uFogColor; varying float vFog;
      void main() { gl_FragColor = vec4(mix(vec3(1.0, 1.1, 1.4), uFogColor, vFog), 1.0); }`,
    side: THREE.DoubleSide,
  }));
  moths.frustumCulled = false;
  scene.add(moths);
}

/* =====================================================================
   8. AUDIO  (all synthesised with the Web Audio API — original tones only)
   ===================================================================== */
const audio = { ctx: null, master: null, sfx: null, muted: false };
function initAudio() {
  if (audio.ctx) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    const ctx = audio.ctx = new AC();
    audio.master = ctx.createGain();
    audio.master.gain.value = audio.muted ? 0 : 1;
    audio.master.connect(ctx.destination);

    // chime bus with a soft feedback echo standing in for reverb
    audio.sfx = ctx.createGain(); audio.sfx.connect(audio.master);
    const delay = ctx.createDelay(1.0), fb = ctx.createGain(), lp = ctx.createBiquadFilter();
    delay.delayTime.value = 0.31; fb.gain.value = 0.42; lp.type = 'lowpass'; lp.frequency.value = 2400;
    audio.sfx.connect(delay); delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(audio.master);

    // ambient drone: layered sine pads, each slowly swelling on its own LFO
    const droneBus = ctx.createGain(); droneBus.gain.value = 0;
    droneBus.gain.linearRampToValueAtTime(0.11, ctx.currentTime + 8);
    const filter = ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 700;
    audio.drone = droneBus;
    droneBus.connect(filter); filter.connect(audio.master);
    [[55, 1], [82.41, 0.7], [110, 0.55], [164.81, 0.38], [220, 0.2], [246.94, 0.16], [329.63, 0.1]].forEach(([f, level], i) => {
      for (const det of [-0.12, 0.17]) {
        const osc = ctx.createOscillator(), g = ctx.createGain(), lfo = ctx.createOscillator(), lg = ctx.createGain();
        osc.type = 'sine'; osc.frequency.value = f + det * (1 + i * 0.4);
        g.gain.value = level * 0.5;
        lfo.frequency.value = 0.025 + Math.random() * 0.06; lg.gain.value = level * 0.32;
        lfo.connect(lg); lg.connect(g.gain);
        osc.connect(g); g.connect(droneBus);
        osc.start(); lfo.start();
      }
    });
  } catch (err) { audio.ctx = null; }
}
// A gentle pentatonic palette; each chime picks a different pitch.
const CHIME_NOTES = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5, 1174.66, 1318.5];
let lastNote = -1;
function playChime(pitchMul = 1, vol = 1) {
  const ctx = audio.ctx; if (!ctx) return;
  let n; do { n = Math.floor(Math.random() * CHIME_NOTES.length); } while (n === lastNote);
  lastNote = n;
  const f = CHIME_NOTES[n] * pitchMul * (1 + (Math.random() - 0.5) * 0.006), t0 = ctx.currentTime;
  [[1, 0.2, 2.6], [2, 0.07, 1.6], [3.01, 0.025, 0.9], [1.5, 0.05, 2.0]].forEach(([mul, amp, dur], i) => {
    const osc = ctx.createOscillator(), g = ctx.createGain(), st = t0 + i * 0.045;
    osc.type = 'sine'; osc.frequency.value = f * mul;
    g.gain.setValueAtTime(0, st);
    g.gain.linearRampToValueAtTime(amp * vol, st + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, st + dur);
    osc.connect(g); g.connect(audio.sfx);
    osc.start(st); osc.stop(st + dur + 0.05);
  });
}
/** A soft three-note owl call. */
function playHoot(vol = 1) {
  const ctx = audio.ctx; if (!ctx) return;
  [[0, 0.36], [0.52, 0.17], [0.74, 0.42]].forEach(([st, dur]) => {
    const osc = ctx.createOscillator(), g = ctx.createGain(), t0 = ctx.currentTime + st;
    osc.type = 'sine'; osc.frequency.setValueAtTime(372, t0); osc.frequency.linearRampToValueAtTime(330, t0 + dur);
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.085 * vol, t0 + 0.06); g.gain.linearRampToValueAtTime(0, t0 + dur);
    osc.connect(g); g.connect(audio.sfx); osc.start(t0); osc.stop(t0 + dur + 0.05);
  });
}
function toggleMute() {
  audio.muted = !audio.muted;
  if (audio.ctx) audio.master.gain.setTargetAtTime(audio.muted ? 0 : 1, audio.ctx.currentTime, 0.15);
  music.el.muted = audio.muted;
  muteBtn.textContent = audio.muted ? 'sound off' : 'sound on';
}

/* =====================================================================
   9. UI  (title, HUD, win state)
   ===================================================================== */
const $ = id => document.getElementById(id);
const titleEl = $('title'), hudEl = $('hud'), countEl = $('count'), hintEl = $('hint'), winEl = $('win'), muteBtn = $('muteBtn');

// Logo placeholder: shown as a dashed box until #logo is given a real src.
{
  const logo = $('logo'), slot = $('logoSlot');
  const show = () => slot.classList.add('has-logo');
  if (logo.getAttribute('src')) { if (logo.complete && logo.naturalWidth) show(); else logo.addEventListener('load', show); }
}
if (IS_MOBILE) {
  $('begin').firstChild.textContent = 'Tap to continue';
  $('controlsLine').textContent = 'left thumb to wander, right thumb to look';
}

function updateHUD(pulse) {
  countEl.textContent = collected;
  if (pulse) { hudEl.classList.remove('pulse'); void hudEl.offsetWidth; hudEl.classList.add('pulse'); }
}
function begin() {
  if (state !== 'title') return;
  initAudio();
  if (audio.ctx && audio.ctx.state === 'suspended') audio.ctx.resume().catch(() => {});
  state = 'intro'; intro.t = 0;
  if (!music.playing) loadTrack(music.i, true);           // the album starts as you step in (if the files are there)
  document.body.classList.add('playing');
  // the cover dissolves into the live scene while the camera flies in (driven in updateCamera)
  intro.zoom = Math.hypot(innerWidth, innerHeight) / frameEl.getBoundingClientRect().width * 1.08;
  titleEl.classList.add('opening');
  cam.yaw = CFG.coverAz; cam.pitch = 0.2; introEase = 1.0;
}
const frameEl = $('frame'), coverEl = $('cover');
frameEl.addEventListener('click', begin);
// Album cover: shown in the frame once #cover is given a real src.
{
  const cover = $('cover'), show = () => frameEl.classList.add('has-cover');
  if (cover.getAttribute('src')) { if (cover.complete && cover.naturalWidth) show(); else cover.addEventListener('load', show); }
}
muteBtn.addEventListener('click', e => { e.stopPropagation(); toggleMute(); muteBtn.blur(); });
/* ---------- Album player (top corner): play / pause, previous, next ----------
   The songs are embedded at the end of this file. Without them, the player looks for the
   files listed below in a folder named "music" next to this HTML file. */
// "file" is the exact file name inside the music folder. (Titles avoid brackets because the typeface has no glyphs for them.)
const PLAYLIST = [
  { title: "Say, All I Need", file: "Say (All I Need).mp3" },
  { title: "Mercy", file: "Mercy.mp3" },
  { title: "Stop and Stare", file: "Stop And Stare.mp3" },
  { title: "Apologize", file: "Apologize.mp3" },
  { title: "Goodbye, Apathy", file: "Goodbye, Apathy.mp3" },
  { title: "All Fall Down", file: "All Fall Down.mp3" },
  { title: "Tyrant", file: "Tyrant.mp3" },
  { title: "Prodigal", file: "Prodigal.mp3" },
  { title: "Won't Stop", file: "Won't Stop.mp3" },
  { title: "All We Are", file: "All We Are.mp3" },
  { title: "Someone to Save You", file: "Someone To Save You.mp3" },
  { title: "Come Home", file: "Come Home.mp3" },
  { title: "Dreaming Out Loud", file: "Dreaming Out Loud.mp3" },
  { title: "Hearing Voices", file: "Hearing Voices.mp3" },
  { title: "Something's Not Right Here", file: "Something's Not Right Here.mp3" },
  { title: "Say, All I Need - Live", file: "Say (All I Need) - Live.mp3" },
].map(t => ({ title: t.title, src: 'music/' + encodeURIComponent(t.file) }));
const music = { el: new Audio(), i: 0, playing: false, missing: 0 };
music.el.preload = 'none';
const trackEl = $('trackTitle'), playBtn = $('playBtn');
// Songs embedded in this file (the "trk1" to "trk16" data blocks at the very end) are used first;
// if a track is not embedded, the player falls back to the file in the music folder.
const blobCache = {};
function trackSrc(i) {
  const tag = document.getElementById('trk' + (i + 1));
  if (!tag) return PLAYLIST[i].src;
  if (!blobCache[i]) {
    const bin = atob(tag.textContent.trim()), bytes = new Uint8Array(bin.length);
    for (let k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
    blobCache[i] = URL.createObjectURL(new Blob([bytes], { type: 'audio/mpeg' }));
  }
  return blobCache[i];
}
function showTrack(note) {
  trackEl.textContent = (music.i + 1) + '. ' + PLAYLIST[music.i].title + (note ? ' ' + note : '');
  playBtn.classList.toggle('on', music.playing);
  // the synthesised drone steps back while a song is playing
  if (audio.ctx && audio.drone) { const g = audio.drone.gain, now = audio.ctx.currentTime; g.cancelScheduledValues(now); g.setTargetAtTime(music.playing ? 0 : 0.11, now, 1.2); }
}
function loadTrack(i, play) {
  music.i = (i + PLAYLIST.length) % PLAYLIST.length;
  music.el.src = trackSrc(music.i); music.el.muted = audio.muted;
  if (play) playTrack(); else { music.playing = false; showTrack(); }
}
function playTrack() {
  music.el.play().then(() => { music.playing = true; music.missing = 0; showTrack(); })
    .catch(() => { music.playing = false; showTrack('- file not found'); });
}
function togglePlay() {
  if (music.playing) { music.el.pause(); music.playing = false; showTrack(); }
  else { if (!music.el.getAttribute('src')) music.el.src = trackSrc(music.i); playTrack(); }
}
const skipTrack = dir => loadTrack(music.i + dir, true);
music.el.addEventListener('ended', () => skipTrack(1));       // the album plays through, then loops
for (const [id, fn] of [['prevBtn', () => skipTrack(-1)], ['playBtn', togglePlay], ['nextBtn', () => skipTrack(1)]])
  $(id).addEventListener('click', e => { e.stopPropagation(); initAudio(); fn(); e.currentTarget.blur(); });
showTrack();


// Win state: the hero tree blazes, the stars intensify, a quiet thank-you appears.
const glow = { hero: 1, heroTarget: 1, stars: 1, starsTarget: 1 };
function triggerWin() {
  state = 'won';
  glow.heroTarget = 2.3; glow.starsTarget = 2.4;
  input.keys.clear(); input.joy.x = input.joy.y = 0;
  for (let i = 0; i < 6; i++) setTimeout(() => {
    spawnBurst(new V3((Math.random() - 0.5) * 16, 8 + Math.random() * 16, (Math.random() - 0.5) * 16), 70, 4);
    playChime(i % 2 ? 1 : 0.5, 0.7);
  }, 400 + i * 450);
  setTimeout(() => winEl.classList.remove('hidden'), 2600);
}
$('againBtn').addEventListener('click', () => {
  winEl.classList.add('hidden');
  glow.heroTarget = 1; glow.starsTarget = 1;
  resetDust();
  shoot.timer = 25;
  state = 'play';
});

/* =====================================================================
   10. POST-PROCESSING  (bloom + weathered-paper grunge + vignette)
   ===================================================================== */
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(
  innerWidth * CFG.pixelRatio, innerHeight * CFG.pixelRatio,
  { type: THREE.HalfFloatType, samples: IS_MOBILE ? 0 : 4 }));
composer.setPixelRatio(CFG.pixelRatio);
composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.6, 0.55, 0.4);
bloom.bloomTintColors.forEach(c => c.set(0.72, 0.83, 1.0));   // keep the aura cold blue-white
composer.addPass(bloom);
composer.addPass(new OutputPass());                         // tone mapping + sRGB

// Grunge: blotchy stains, scratches, grain and a dark vignette, like ink on old textured paper.
const grunge = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uRes: { value: new THREE.Vector2(innerWidth, innerHeight) } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse; uniform float uTime; uniform vec2 uRes; varying vec2 vUv;
    float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
    float noise(vec2 p) {
      vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
    }
    float fbm(vec2 p) { float v = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { v += a * noise(p); p = p * 2.03 + 17.1; a *= 0.5; } return v; }
    void main() {
      vec3 c = texture2D(tDiffuse, vUv).rgb;
      vec2 p = vUv * vec2(uRes.x / uRes.y, 1.0);

      // large blotchy stains + finer mottling, multiplied in like uneven ink
      float blot = fbm(p * 2.6 + 3.7), mott = fbm(p * 9.0 - 5.1);
      c *= 0.80 + 0.30 * blot + 0.10 * (mott - 0.5);
      // worn patches where pale paper shows through the ink
      float worn = smoothstep(0.60, 0.82, fbm(p * 5.5 + 21.0)) * smoothstep(0.35, 0.7, fbm(p * 38.0));
      c += vec3(0.30, 0.38, 0.55) * worn * 0.085;
      // paper fibre speckle (static)
      float fib = hash(floor(vUv * uRes / 1.5));
      c += vec3(0.5, 0.6, 0.8) * step(0.994, fib) * 0.05;
      c *= 1.0 - step(fib, 0.0012) * 0.22;
      // faint scratches: long, slightly wavering hairlines
      float sx = p.x * 70.0 + (fbm(vec2(p.y * 1.6, 9.0)) - 0.5) * 2.2;
      float id = floor(sx);
      float line = step(0.9, hash(vec2(id, 3.0))) * (1.0 - smoothstep(0.0, 0.07, abs(fract(sx) - 0.5)));
      line *= smoothstep(0.45, 0.75, noise(vec2(id * 3.1, p.y * 2.5 + id)));
      c += vec3(0.55, 0.66, 0.9) * line * 0.06;
      // film grain (animated)
      c += (hash(vUv * uRes + fract(uTime) * 311.0) - 0.5) * 0.045;
      // dark vignette
      vec2 q = vUv - 0.5;
      c *= mix(0.3, 1.0, smoothstep(0.95, 0.3, length(q * vec2(1.1, 1.25))));
      gl_FragColor = vec4(max(c, 0.0), 1.0);
    }`,
});
composer.addPass(grunge);

addEventListener('resize', () => {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h); composer.setSize(w, h);
  grunge.uniforms.uRes.value.set(w, h);
  pointUniforms.uScale.value = h * 0.9;
});

/* =====================================================================
   11. MAIN LOOP
   ===================================================================== */
resetDust();
const clock = new THREE.Clock();
const heroLightBase = heroLight.intensity;

function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;

  updatePlayer(dt, t, state === 'play');
  updateCamera(dt, t);
  updateDust(dt, t);
  updateBurst(dt);
  updateShooting(dt);
  updateMotes(dt, t);
  updateFireflies(dt, t);
  updateWildlife(dt, t);
  updateGiants(dt, t);
  if (quake > 0.002) {                                     // the whole place shakes a little with each giant step
    camera.position.x += Math.sin(t * 31) * quake; camera.position.y += Math.sin(t * 37 + 1) * quake * 1.3;
    camera.rotation.z += Math.sin(t * 29 + 2) * quake * 0.012;
  }

  // haze thickens as you step from the cover into the forest; plants follow the player
  scene.fog.density = lerp(scene.fog.density, state === 'title' ? 0.004 : 0.0125, damp(dt, 0.7));
  floraUniforms.uFogDensity.value = scene.fog.density;
  floraUniforms.uCenter.value.set(cam.look.x, cam.look.z);
  floraUniforms.uPlayer.value.copy(player.root.position);

  // slow global glow changes (win state eases in and out)
  glow.hero = lerp(glow.hero, glow.heroTarget, damp(dt, 0.7));
  glow.stars = lerp(glow.stars, glow.starsTarget, damp(dt, 0.7));
  const breathe = 1 + Math.sin(t * 0.6) * 0.04;
  heroMat.color.setScalar(glow.hero * breathe);
  heroLight.intensity = heroLightBase * glow.hero * breathe;
  heroDecalMat.opacity = Math.min(1, 0.55 * glow.hero);
  bloom.strength = 0.6 + (glow.hero - 1) * 0.16;
  floraUniforms.uHeroGlow.value = glow.hero;
  starUniforms.uIntensity.value = glow.stars;
  starUniforms.uTime.value = t; swayTime.value = t; grunge.uniforms.uTime.value = t;

  composer.render();
}

// Everything is built: reveal "Click to begin".
state = 'title';
$('loading').style.display = 'none';
$('begin').style.display = 'block';
frame();
</script>
